<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e4d7c2"/>
    </linearGradient>
    <linearGradient id="wallSide3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dccdb2"/>
      <stop offset="1" stop-color="#d2c0a2"/>
    </linearGradient>
    <linearGradient id="floor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48f5e"/>
      <stop offset="1" stop-color="#9c7748"/>
    </linearGradient>
    <linearGradient id="skyOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35504a"/>
      <stop offset="1" stop-color="#c8b998"/>
    </linearGradient>
    <linearGradient id="lamp3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e0b0"/>
      <stop offset="1" stop-color="#d8b877"/>
    </linearGradient>
  </defs>

  <!-- Back wall -->
  <rect width="1600" height="1000" fill="url(#wall3)"/>

  <!-- Floor -->
  <rect y="760" width="1600" height="240" fill="url(#floor3)"/>
  <line x1="0" y1="762" x2="1600" y2="762" stroke="#8a6a3f" stroke-width="4" opacity="0.5"/>

  <!-- Wall trim -->
  <rect y="740" width="1600" height="24" fill="#fff9ee" opacity="0.85"/>

  <!-- Floor-to-ceiling window -->
  <g>
    <rect x="880" y="120" width="560" height="620" fill="url(#skyOut)"/>
    <rect x="880" y="120" width="560" height="620" fill="#000000" opacity="0.06"/>
    <!-- Window mullions -->
    <g stroke="#fff9ee" stroke-width="14">
      <line x1="1160" y1="120" x2="1160" y2="740"/>
    </g>
    <g stroke="#d8c9ac" stroke-width="8">
      <line x1="880" y1="120" x2="1440" y2="120"/>
      <line x1="880" y1="740" x2="1440" y2="740"/>
    </g>
    <!-- Horizon through window -->
    <line x1="880" y1="470" x2="1440" y2="470" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Pendant light -->
  <g>
    <line x1="520" y1="0" x2="520" y2="150" stroke="#8a6a3f" stroke-width="5"/>
    <path d="M430 150 Q520 240 610 150 L590 150 Q520 210 450 150 Z" fill="url(#lamp3)"/>
    <circle cx="520" cy="210" r="120" fill="#f4e0b0" opacity="0.12"/>
  </g>

  <!-- Sofa -->
  <g>
    <path d="M220 690 L220 610 Q220 580 252 580 L640 580 Q672 580 672 610 L672 690 Z" fill="#4b4f52"/>
    <path d="M200 660 L200 640 L240 640 L240 690 L200 690 Z" fill="#45494c"/>
    <path d="M632 660 L632 640 L672 640 L672 690 L632 690 Z" fill="#45494c"/>
    <!-- Cushions -->
    <rect x="260" y="596" width="120" height="44" rx="8" fill="#5d6266"/>
    <rect x="400" y="596" width="120" height="44" rx="8" fill="#5d6266"/>
    <rect x="540" y="596" width="100" height="44" rx="8" fill="#565b5f"/>
    <!-- Legs -->
    <rect x="232" y="690" width="10" height="26" fill="#2f3235"/>
    <rect x="650" y="690" width="10" height="26" fill="#2f3235"/>
  </g>

  <!-- Coffee table -->
  <g>
    <rect x="320" y="740" width="240" height="16" rx="3" fill="#a07b4b"/>
    <rect x="332" y="756" width="12" height="40" fill="#8a6a3f"/>
    <rect x="536" y="756" width="12" height="40" fill="#8a6a3f"/>
    <rect x="420" y="722" width="42" height="18" rx="4" fill="#c4a265"/>
  </g>

  <!-- Floor lamp -->
  <g>
    <rect x="738" y="560" width="8" height="180" fill="#3a3e41"/>
    <path d="M706 560 L778 560 L762 500 L722 500 Z" fill="#c4a265"/>
    <ellipse cx="742" cy="742" rx="44" ry="8" fill="#2f3235"/>
  </g>

  <!-- Art frame on wall -->
  <rect x="200" y="180" width="180" height="230" fill="#fff9ee"/>
  <rect x="216" y="196" width="148" height="198" fill="#33513f"/>
  <path d="M216 300 Q260 250 306 292 Q340 320 364 280 L364 394 L216 394 Z" fill="#c4a265"/>
  <path d="M216 340 Q250 320 280 350" stroke="#e6d4ac" stroke-width="4" fill="none"/>

  <!-- Side table + plant -->
  <g>
    <rect x="200" y="700" width="70" height="44" rx="4" fill="#a07b4b"/>
    <rect x="210" y="740" width="50" height="22" fill="#c4a265"/>
    <rect x="222" y="668" width="26" height="34" rx="4" fill="#8a6a3f"/>
    <g fill="#33513f">
      <path d="M235 668 Q212 636 235 618 Q258 636 235 668"/>
      <path d="M235 668 Q218 646 238 626 Q252 644 235 668"/>
      <path d="M235 668 Q252 640 232 622"/>
    </g>
  </g>

  <!-- Floor shadows -->
  <g fill="#7a5c33" opacity="0.25">
    <ellipse cx="520" cy="780" rx="260" ry="26"/>
    <ellipse cx="742" cy="780" rx="60" ry="12"/>
    <ellipse cx="440" cy="792" rx="140" ry="16"/>
  </g>
</svg>
