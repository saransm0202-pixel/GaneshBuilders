<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe8d8"/>
      <stop offset="1" stop-color="#e3d9c3"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>

  <!-- Grid lines -->
  <g stroke="#c9bda1" stroke-width="1" opacity="0.55">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
  </g>

  <!-- Border frame -->
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#9b8a68" stroke-width="3"/>
  <rect x="52" y="52" width="1496" height="896" fill="none" stroke="#9b8a68" stroke-width="1" opacity="0.5"/>

  <!-- Title block -->
  <g stroke="#33513f" stroke-width="2.5" fill="none">
    <line x1="60" y1="880" x2="1540" y2="880"/>
    <line x1="60" y1="850" x2="1540" y2="850"/>
    <line x1="60" y1="820" x2="1540" y2="820"/>
    <line x1="60" y1="880" x2="420" y2="820"/>
    <line x1="740" y1="880" x2="740" y2="820"/>
    <line x1="1100" y1="880" x2="1100" y2="820"/>
  </g>

  <!-- Elevation drawing -->
  <g fill="none" stroke="#33513f" stroke-linejoin="round">
    <!-- Ground line -->
    <line x1="300" y1="760" x2="1300" y2="760" stroke-width="4"/>

    <!-- Main building outline -->
    <path d="M340 760 L340 480 L470 480 L470 380 L600 380 L600 320 L880 320 L880 380 L1010 380 L1010 480 L1140 480 L1140 760 Z" stroke-width="5"/>

    <!-- Roof -->
    <path d="M470 380 L600 260 L880 260 L1010 380" stroke-width="5"/>

    <!-- Second floor mass -->
    <path d="M560 380 L560 500 L760 500 L760 380" stroke-width="3.5" opacity="0.75"/>

    <!-- Windows ground -->
    <rect x="380" y="520" width="90" height="130" stroke-width="3.5"/>
    <rect x="380" y="520" width="45" height="65" stroke-width="2.5"/>
    <line x1="425" y1="520" x2="425" y2="650" stroke-width="2"/>
    <rect x="1220" y="520" width="90" height="130" stroke-width="3.5"/>
    <line x1="1265" y1="520" x2="1265" y2="650" stroke-width="2"/>

    <!-- Windows upper -->
    <rect x="600" y="400" width="80" height="90" stroke-width="3.5"/>
    <line x1="640" y1="400" x2="640" y2="490" stroke-width="2"/>
    <rect x="860" y="400" width="80" height="90" stroke-width="3.5"/>
    <line x1="900" y1="400" x2="900" y2="490" stroke-width="2"/>

    <!-- Door -->
    <rect x="1020" y="560" width="90" height="200" stroke-width="3.5"/>
    <line x1="1065" y1="560" x2="1065" y2="760" stroke-width="2"/>
    <circle cx="1032" cy="660" r="4" stroke-width="2" fill="#33513f"/>

    <!-- Balcony railing -->
    <g stroke-width="2.5">
      <line x1="600" y1="520" x2="880" y2="520"/>
      <line x1="600" y1="540" x2="880" y2="540"/>
      <line x1="600" y1="520" x2="600" y2="560"/>
      <line x1="880" y1="520" x2="880" y2="560"/>
    </g>

    <!-- Dimension lines -->
    <g stroke-width="1.8" stroke="#9b8a68">
      <line x1="340" y1="790" x2="1140" y2="790"/>
      <line x1="340" y1="786" x2="340" y2="796"/>
      <line x1="1140" y1="786" x2="1140" y2="796"/>
      <line x1="1200" y1="320" x2="1200" y2="760"/>
      <line x1="1196" y1="320" x2="1204" y2="320"/>
      <line x1="1196" y1="760" x2="1204" y2="760"/>
    </g>

    <!-- Trees -->
    <path d="M240 760 L240 620 Q240 560 268 560 Q296 560 296 620 L296 760 Z" stroke-width="2.5" opacity="0.8"/>
    <path d="M1360 760 L1360 640 Q1360 590 1384 590 Q1408 590 1408 640 L1408 760 Z" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Stamped annotations -->
  <g fill="#9b8a68" opacity="0.9">
    <circle cx="120" cy="150" r="70" fill="none" stroke="#9b8a68" stroke-width="2.5"/>
    <text x="120" y="145" font-family="Georgia, serif" font-size="15" text-anchor="middle" letter-spacing="4">GH</text>
    <text x="120" y="168" font-family="Georgia, serif" font-size="11" text-anchor="middle" letter-spacing="2">GANESH HOMES</text>
    <circle cx="120" cy="222" r="4" fill="#9b8a68"/>
    <circle cx="120" cy="242" r="4" fill="#9b8a68"/>
    <circle cx="120" cy="262" r="4" fill="#9b8a68"/>
  </g>
</svg>
