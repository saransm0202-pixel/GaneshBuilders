<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2629"/>
      <stop offset="0.55" stop-color="#2c3a38"/>
      <stop offset="0.8" stop-color="#4a4a40"/>
      <stop offset="1" stop-color="#6b5c45"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f28"/>
      <stop offset="1" stop-color="#1a1f1b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d9a6"/>
      <stop offset="1" stop-color="#c99b52"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#b07f3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e7c0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f7e7c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#efe6cf" opacity="0.55">
    <circle cx="180" cy="120" r="2.2"/>
    <circle cx="430" cy="90" r="1.6"/>
    <circle cx="720" cy="150" r="2"/>
    <circle cx="980" cy="80" r="1.8"/>
    <circle cx="1240" cy="130" r="2.4"/>
    <circle cx="1460" cy="70" r="1.6"/>
    <circle cx="1090" cy="180" r="1.5"/>
    <circle cx="300" cy="220" r="1.4"/>
    <circle cx="880" cy="210" r="1.7"/>
  </g>

  <!-- Moon glow -->
  <circle cx="1310" cy="180" r="150" fill="url(#glow)" opacity="0.5"/>
  <circle cx="1310" cy="180" r="46" fill="#efe6cf" opacity="0.92"/>

  <!-- Distant treeline -->
  <g fill="#1c221d" opacity="0.8">
    <path d="M0 640 Q60 600 120 640 Q180 585 240 640 Q300 600 360 640 Q420 590 480 640 Q540 605 600 640 Q660 592 720 640 Q780 600 840 640 Q900 588 960 640 Q1020 600 1080 640 Q1140 592 1200 640 Q1260 605 1320 640 Q1380 595 1440 640 Q1500 600 1600 640 L1600 660 L0 660 Z"/>
  </g>

  <!-- Ground -->
  <rect y="648" width="1600" height="352" fill="url(#ground)"/>

  <!-- Ground texture / lawn -->
  <path d="M0 648 L1600 648 L1600 700 Q1200 678 800 700 Q400 722 0 700 Z" fill="#31402f" opacity="0.9"/>

  <!-- Pathway -->
  <path d="M880 1000 L940 820 L1060 820 L1180 1000 Z" fill="#2a2e29"/>

  <!-- Villa body -->
  <g>
    <!-- Main volume -->
    <rect x="520" y="380" width="640" height="300" fill="#2f3433"/>
    <!-- Upper volume -->
    <rect x="620" y="260" width="440" height="180" fill="#3a403e"/>
    <!-- Roof slab -->
    <rect x="600" y="238" width="480" height="26" fill="#242827"/>
    <!-- Side wing -->
    <rect x="1080" y="440" width="180" height="240" fill="#2b3030"/>
    <rect x="1064" y="424" width="210" height="18" fill="#20242a"/>

    <!-- Dark stone cladding band -->
    <rect x="520" y="560" width="640" height="120" fill="#262b2c"/>
    <rect x="1080" y="600" width="180" height="80" fill="#222728"/>

    <!-- Warm large windows -->
    <rect x="585" y="430" width="150" height="120" fill="url(#glass)"/>
    <rect x="760" y="430" width="150" height="120" fill="url(#glass)"/>
    <!-- Mullions -->
    <g stroke="#4a4636" stroke-width="5">
      <line x1="660" y1="430" x2="660" y2="550"/>
      <line x1="585" y1="490" x2="735" y2="490"/>
      <line x1="835" y1="430" x2="835" y2="550"/>
      <line x1="760" y1="490" x2="910" y2="490"/>
    </g>

    <!-- Upper windows -->
    <rect x="660" y="300" width="100" height="90" fill="url(#glass2)"/>
    <rect x="880" y="300" width="100" height="90" fill="url(#glass2)"/>
    <g stroke="#4a4636" stroke-width="4">
      <line x1="710" y1="300" x2="710" y2="390"/>
      <line x1="930" y1="300" x2="930" y2="390"/>
    </g>

    <!-- Side wing windows -->
    <rect x="1100" y="470" width="70" height="110" fill="url(#glass2)"/>
    <rect x="1190" y="470" width="50" height="110" fill="url(#glass)"/>
    <g stroke="#4a4636" stroke-width="4">
      <line x1="1135" y1="470" x2="1135" y2="580"/>
    </g>

    <!-- Entrance -->
    <rect x="942" y="540" width="96" height="140" fill="#1d2123"/>
    <rect x="952" y="550" width="76" height="130" fill="#0f1213"/>
    <line x1="1020" y1="560" x2="1020" y2="672" stroke="#ff7d00" stroke-width="3"/>
    <rect x="985" y="470" width="42" height="44" fill="url(#glass2)" opacity="0.9"/>

    <!-- Column / pier -->
    <rect x="500" y="560" width="24" height="120" fill="#20242a"/>
    <rect x="1156" y="560" width="24" height="120" fill="#20242a"/>

    <!-- Warm ground light spill -->
    <rect x="585" y="660" width="150" height="10" fill="#c99b52" opacity="0.25"/>
    <rect x="760" y="660" width="150" height="10" fill="#c99b52" opacity="0.25"/>
  </g>

  <!-- Trees -->
  <g>
    <path d="M300 650 Q250 520 300 420 Q350 320 300 240 Q280 180 310 130 Q400 190 380 300 Q360 420 430 500 Q480 560 440 650 Z" fill="#223028"/>
    <path d="M1330 650 Q1280 560 1310 470 Q1340 390 1300 330 Q1360 290 1400 360 Q1430 430 1390 520 Q1370 580 1400 650 Z" fill="#1d2920"/>
  </g>

  <!-- Fence hint -->
  <g stroke="#3a403e" stroke-width="4" opacity="0.7">
    <line x1="0" y1="700" x2="480" y2="700"/>
    <line x1="1120" y1="700" x2="1600" y2="700"/>
  </g>
</svg>
