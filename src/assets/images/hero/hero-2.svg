<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa0a3"/>
      <stop offset="0.6" stop-color="#c3c9c0"/>
      <stop offset="1" stop-color="#dcd7c6"/>
    </linearGradient>
    <linearGradient id="frameWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a86b"/>
      <stop offset="1" stop-color="#a8874e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b47f"/>
      <stop offset="1" stop-color="#b68d52"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky2)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="300" cy="180" rx="160" ry="46"/>
    <ellipse cx="380" cy="160" rx="120" ry="38"/>
    <ellipse cx="1200" cy="260" rx="180" ry="44"/>
    <ellipse cx="1270" cy="240" rx="110" ry="34"/>
  </g>

  <!-- Ground -->
  <rect y="700" width="1600" height="300" fill="#7d7d6a"/>
  <path d="M0 700 L1600 700 L1600 740 Q1200 726 800 740 Q400 754 0 740 Z" fill="#6d6d5c"/>

  <!-- Crane -->
  <g>
    <rect x="1210" y="180" width="16" height="520" fill="url(#steel)"/>
    <rect x="1196" y="170" width="44" height="10" fill="#9c7a44"/>
    <rect x="1210" y="120" width="10" height="60" fill="url(#steel)"/>
    <line x1="1215" y1="120" x2="1500" y2="120" stroke="url(#steel)" stroke-width="10"/>
    <line x1="1215" y1="120" x2="1360" y2="40" stroke="#a8854c" stroke-width="7"/>
    <line x1="1215" y1="120" x2="1215" y2="240" stroke="#a8854c" stroke-width="6"/>
    <line x1="1495" y1="120" x2="1495" y2="330" stroke="#8d6f3e" stroke-width="4"/>
    <rect x="1460" y="320" width="70" height="52" fill="#6d5a33"/>
    <g stroke="#ff7d00" stroke-width="3" opacity="0.8">
      <line x1="1200" y1="130" x2="1215" y2="120"/>
      <line x1="1215" y1="120" x2="1230" y2="130"/>
      <line x1="1230" y1="180" x2="1240" y2="300"/>
      <line x1="1200" y1="180" x2="1190" y2="300"/>
    </g>
  </g>

  <!-- House frame under construction -->
  <g>
    <!-- Base slab -->
    <rect x="340" y="670" width="720" height="34" fill="#9a9a88"/>
    <rect x="330" y="660" width="740" height="14" fill="#8b8b79"/>

    <!-- Brick ground floor walls -->
    <g fill="#a8885b">
      <rect x="360" y="480" width="680" height="180"/>
      <!-- Brick courses -->
      <g stroke="#8f7248" stroke-width="3" opacity="0.8">
        <line x1="360" y1="510" x2="1040" y2="510"/>
        <line x1="360" y1="540" x2="1040" y2="540"/>
        <line x1="360" y1="570" x2="1040" y2="570"/>
        <line x1="360" y1="600" x2="1040" y2="600"/>
        <line x1="360" y1="630" x2="1040" y2="630"/>
      </g>
      <!-- Door opening -->
      <rect x="640" y="520" width="120" height="140" fill="#3c3830"/>
      <rect x="650" y="530" width="100" height="130" fill="#26241e"/>
    </g>

    <!-- Window openings -->
    <rect x="400" y="510" width="150" height="110" fill="#3c3830"/>
    <rect x="880" y="510" width="130" height="110" fill="#3c3830"/>

    <!-- Timber post & beam first floor -->
    <g fill="url(#frameWall)">
      <rect x="340" y="430" width="720" height="16"/>
      <rect x="340" y="300" width="720" height="16"/>
      <rect x="360" y="300" width="16" height="132"/>
      <rect x="500" y="300" width="16" height="132"/>
      <rect x="720" y="300" width="16" height="132"/>
      <rect x="930" y="300" width="16" height="132"/>
      <rect x="1030" y="300" width="16" height="132"/>
    </g>

    <!-- First floor openings (raw) -->
    <rect x="395" y="330" width="90" height="90" fill="#3c3830"/>
    <rect x="535" y="330" width="150" height="90" fill="#3c3830"/>
    <rect x="770" y="330" width="120" height="90" fill="#3c3830"/>

    <!-- Roof rafters -->
    <g stroke="#b28d50" stroke-width="14" fill="none">
      <line x1="340" y1="300" x2="470" y2="200"/>
      <line x1="470" y1="200" x2="600" y2="300"/>
      <line x1="600" y1="300" x2="740" y2="200"/>
      <line x1="740" y1="200" x2="880" y2="300"/>
      <line x1="880" y1="300" x2="1000" y2="210"/>
      <line x1="1000" y1="210" x2="1120" y2="300"/>
    </g>
    <line x1="340" y1="300" x2="470" y2="200" stroke="#8d6f3e" stroke-width="6" transform="translate(0,-10)"/>
    <line x1="740" y1="200" x2="880" y2="300" stroke="#8d6f3e" stroke-width="6" transform="translate(0,-10)"/>

    <!-- Scaffolding -->
    <g stroke="#d5c8a8" stroke-width="7" opacity="0.9">
      <line x1="320" y1="200" x2="320" y2="690"/>
      <line x1="1130" y1="200" x2="1130" y2="690"/>
      <line x1="320" y1="260" x2="1130" y2="260"/>
      <line x1="320" y1="380" x2="1130" y2="380"/>
      <line x1="320" y1="500" x2="1130" y2="500"/>
      <line x1="320" y1="620" x2="1130" y2="620"/>
    </g>
    <g stroke="#b8a77f" stroke-width="6">
      <line x1="320" y1="260" x2="1130" y2="300" opacity="0.7"/>
      <line x1="320" y1="500" x2="1130" y2="540" opacity="0.7"/>
    </g>

    <!-- Dirt / materials -->
    <g fill="#5f5f4e">
      <rect x="430" y="700" width="120" height="50"/>
      <rect x="980" y="700" width="150" height="50"/>
    </g>
    <g fill="#4c4c3d">
      <rect x="560" y="710" width="60" height="40"/>
      <rect x="1050" y="712" width="40" height="38"/>
    </g>
  </g>
</svg>
