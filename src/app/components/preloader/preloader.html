<div class="pre">
  <canvas class="pre__canvas" #canvas aria-hidden="true"></canvas>

  <div class="pre__fx" aria-hidden="true"></div>

  <header class="pre__brand">
    <span class="pre__mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="46" height="46">
        <defs>
          <linearGradient id="preMark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f3ddb0" />
            <stop offset="1" stop-color="#b98a3f" />
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#preMark)" />
        <path d="M24 11 L39 35 H35 L24 18 L13 35 H9 Z" fill="#101712" />
        <rect x="21" y="28" width="6" height="9" fill="#101712" />
      </svg>
    </span>
    <div class="pre__brand-text">
      <p class="pre__name">{{ siteConfig.appName() }}</p>
      <p class="pre__tag">Building Dreams · Creating Homes</p>
    </div>
  </header>

  <footer class="pre__status">
    <div class="pre__status-row">
      <span class="pre__status-label">Preparing your experience</span>
      <span class="pre__status-pct">{{ pct() }}%</span>
    </div>
    <div class="pre__progress">
      <span class="pre__bar" [style.width.%]="pct()"></span>
    </div>
    <div class="pre__status-meta">
      <span>Ganesh Homes · Architectural Render</span>
      <span>{{ pct() >= 100 ? 'Ready to reveal' : 'Loading site data…' }}</span>
    </div>
  </footer>

  <div class="pre__hud" aria-hidden="true">
    <span class="pre__hud--corner pre__hud--tl"></span>
    <span class="pre__hud--corner pre__hud--tr"></span>
    <span class="pre__hud--corner pre__hud--bl"></span>
    <span class="pre__hud--corner pre__hud--br"></span>
  </div>
</div>
