<div class="pre">
  <div class="pre__wordmark">
    <span class="pre__initial">{{ initial }}</span>
    <div class="pre__text">
      <span class="pre__name">{{ siteConfig.appName() }}</span>
      <span class="pre__sub">{{ tagline }}</span>
    </div>
  </div>

  <div class="pre__bar" aria-hidden="true">
    <span class="pre__fill" [style.width.%]="pct()"></span>
  </div>

  <span class="pre__progress" aria-hidden="true">{{ progressText }}</span>
</div>
