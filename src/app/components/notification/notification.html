@if (notify.visible()) {
  <div
    class="ntf"
    [class.ntf--err]="notify.type() === 'error'"
    [class.ntf--info]="notify.type() === 'info'"
    (click)="notify.dismiss()"
  >
    @if (notify.type() === 'success') {
      <svg class="ntf__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    } @else if (notify.type() === 'error') {
      <svg class="ntf__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
    } @else {
      <svg class="ntf__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
    }
    <span class="ntf__msg">{{ notify.message() }}</span>
  </div>
}
