<div class="bp">
  <div class="bp__canvas">
    <div class="bp__grid" aria-hidden="true"></div>
    <svg class="bp__dims" aria-hidden="true">
      <line x1="12" y1="6" x2="12" y2="30" />
      <line x1="6" y1="24" x2="42" y2="24" />
      <text x="16" y="8">29.7 m</text>
      <text x="4" y="42">14.5 m</text>
    </svg>
    <svg class="bp__house" viewBox="0 0 240 180" aria-hidden="true">
      <g class="bp__house__frame">
        <path d="M20 130 L20 78 L120 22 L220 78 L220 130" />
        <path d="M52 130 L52 96 L120 60 L188 96 L188 130" class="bp__house__wall" />
        <path d="M120 22 L120 8" />
        <line x1="34" y1="130" x2="206" y2="130" class="bp__house__base" />
        <path d="M74 130 L74 102 M86 130 L86 102 M146 130 L146 102 M158 130 L158 102" class="bp__house__cols" />
        <path d="M120 60 L92 88 M120 60 L148 88" class="bp__house__roof" />
        <path d="M20 78 L120 22 L220 78" class="bp__house__roofline" />
      </g>
    </svg>
    <div class="bp__photo">
      <img [src]="image()" [alt]="alt()" loading="lazy" />
    </div>
  </div>
  @if (label()) {
    <span class="bp__label">{{ label() }}</span>
  }
</div>
